[package]
name = "pswm-core"
description = "PswManager's core: the KeePass database, merging, syncing and the stores"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Encrypted Aegis exports (#282): AES-256-GCM, the key from scrypt.
aes-gcm = "0.11"
base32 = "0.5.1"
base64 = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
hmac = "0.13"
# Pictures of TOTP QR codes (#279): PNG and JPEG only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keepass = { version = "0.17", features = ["save_kdbx4"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
percent-encoding = "2"
psl = "2"
regex = "1"
scrypt = { version = "0.12", default-features = false }
# Finds and reads the QR code in such a picture (pure Rust, no image crate of its own).
rqrr = { version = "0.11", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
totp-lite = "2.0.1"
ureq = { version = "3.2.1", default-features = false, features = ["gzip"] }
url = "2"
uuid = "1"
zeroize = { workspace = true }
zxcvbn = { workspace = true }

# TLS: Windows' own (native-tls, so no `ring`, which needs clang on ARM64);
# on Android rustls with the bundled Mozilla roots (native-tls would need OpenSSL).
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "3.2.1", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
ureq = { version = "3.2.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Draws the QR codes the tests read back.
qrcode = { version = "0.14", default-features = false }
tempfile = { workspace = true }
