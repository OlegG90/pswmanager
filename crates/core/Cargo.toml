[package]
name = "pswm-core"
description = "PswManager's core: the KeePass database, merging, syncing and the stores"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base32 = "0.5.1"
base64 = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
hmac = "0.13"
keepass = { version = "0.15", features = ["save_kdbx4"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
percent-encoding = "2"
psl = "2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
totp-lite = "2.0.1"
ureq = { version = "3.2.1", default-features = false, features = ["gzip"] }
url = "2"
uuid = "1"
zeroize = { workspace = true }
zxcvbn = { workspace = true }

# TLS: Windows' own (native-tls, so no `ring`, which needs clang on ARM64);
# on Android rustls with the bundled Mozilla roots (native-tls would need OpenSSL).
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "3.2.1", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
ureq = { version = "3.2.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = { workspace = true }
