<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unlock</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#005FB8}a:hover{color:#003E92}
.win{--bg:#F3F3F3;--layer:#F9F9F9;--card:#FFFFFF;--stroke:#E5E5E5;--text:#1B1B1B;--text2:#5D5D5D;--ctl:#FFFFFF;--ctlstroke:#E5E5E5;--ctlbottom:#C4C4C4;--tbline:#868686;--subtle:rgba(0,0,0,.04);--subtle2:rgba(0,0,0,.06);--accent:#005FB8;--onaccent:#FFFFFF;--infobg:#F6F6F6;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
.win.dark{--bg:#202020;--layer:#272727;--card:#2B2B2B;--stroke:#1D1D1D;--text:#FFFFFF;--text2:#C5C5C5;--ctl:#2D2D2D;--ctlstroke:#353535;--ctlbottom:#2A2A2A;--tbline:#9A9A9A;--subtle:rgba(255,255,255,.06);--subtle2:rgba(255,255,255,.08);--accent:#60CDFF;--onaccent:#000000;--infobg:#2B2B2B}
.disp{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;font-weight:600}
.cap{font-size:12px;color:var(--text2)}
.btn{font:inherit;font-size:14px;height:32px;box-sizing:border-box;padding:0 12px;border-radius:4px;border:1px solid var(--ctlstroke);border-bottom-color:var(--ctlbottom);background:var(--ctl);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.accent{background:var(--accent);color:var(--onaccent);border-color:transparent}
.btn.subtle{background:transparent;border-color:transparent}
.btn.icon{width:32px;padding:0}
.link{font:inherit;background:none;border:0;padding:0;color:var(--accent);cursor:pointer}
.tb{display:flex;align-items:center;height:32px;box-sizing:border-box;border-radius:4px;border:1px solid var(--ctlstroke);border-bottom:1px solid var(--tbline);background:var(--ctl);overflow:hidden}
.tb.focus{border-bottom:2px solid var(--accent)}
.tb input{flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;color:var(--text);padding:0 11px;outline:none}
.capbtn{width:46px;height:32px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.c{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1}
</style>
</helmet>
<div class="win {{themeClass}}" style="width: 1280px; height: 800px; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 32px; display: flex; align-items: center; gap: 10px; padding-left: 14px; flex: none">
    <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M12 2.5l8 3v6c0 4.8-3.4 8.6-8 10-4.6-1.4-8-5.2-8-10v-6z"></path><circle cx="12" cy="11" r="2.5"></circle><path d="M12 13.5V17"></path></svg>
    <span style="font-size: 12px">PswManager</span>
    <div style="margin-left: auto; display: flex">
      <button class="capbtn" aria-label="Minimize"><svg class="c" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10"></path></svg></button>
      <button class="capbtn" aria-label="Maximize"><svg class="c" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1"></rect></svg></button>
      <button class="capbtn" aria-label="Close"><svg class="c" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10"></path></svg></button>
    </div>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center">
    <form style="width: 420px; box-sizing: border-box; padding: 32px; background: var(--layer); border: 1px solid var(--stroke); border-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,.14); display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="width: 64px; height: 64px; border-radius: 14px; background: var(--accent); display: flex; align-items: center; justify-content: center">
          <svg viewBox="0 0 24 24" style="width: 36px; height: 36px; fill: none; stroke: var(--onaccent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M12 2.5l8 3v6c0 4.8-3.4 8.6-8 10-4.6-1.4-8-5.2-8-10v-6z"></path><circle cx="12" cy="11" r="2.5"></circle><path d="M12 13.5V17"></path></svg>
        </div>
        <h1 class="disp" style="margin: 4px 0 0; font-size: 28px; line-height: 36px">PswManager</h1>
        <span class="cap">Version [X.Y.Z]</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="db" style="font-size: 14px">Database</label>
        <div style="display: flex; gap: 8px">
          <button id="db" type="button" class="btn" style="flex: 1; justify-content: space-between; height: 52px; padding: 0 12px">
            <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0">
              <span style="font-weight: 600">Personal</span>
              <span class="cap">Documents\PswManager\Personal.kdbx · OneDrive</span>
            </span>
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <button type="button" class="btn" style="height: 52px">Add…</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="pw">Master password</label>
        <div class="tb focus">
          <input id="pw" type="password" value="correcthorse">
          <button type="button" class="btn subtle icon" style="height: 28px; width: 28px; margin-right: 2px" aria-label="Show password"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px">
          <button type="button" class="link" style="font-size: 12px">Use a key file…</button>
          <span class="cap">— only if this database was set up with one.</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <button type="submit" class="btn accent" style="height: 36px; width: 100%">Unlock</button>
        <button type="button" class="btn" style="height: 36px; width: 100%">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M9 10v1M15 10v1M9.5 15c1.4.9 3.6.9 5 0"></path></svg>
          Unlock with Windows Hello
        </button>
      </div>

      <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 4px; background: var(--infobg); border: 1px solid var(--stroke)" role="status">
        <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; flex: none; margin-top: 2px" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--accent)"></circle><path d="M12 11v6M12 7.5v.01" stroke="var(--onaccent)" stroke-width="2" stroke-linecap="round"></path></svg>
        <span style="font-size: 13px; line-height: 19px"><b style="font-weight: 600">Ctrl+Alt+P</b> shows this window from anywhere. Closing it keeps PswManager in the tray.</span>
      </div>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.dark ?? false) ? 'dark' : '' };
  }
}
</script>
</body>
</html>
