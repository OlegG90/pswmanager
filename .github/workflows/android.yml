# Builds the Android app (apps/android) into an APK for the phone, signed with
# the release key (arm64 only: the reference phone and every current phone). The Android SDK,
# NDK and JDK have no Windows-on-ARM64 builds, so the APK is made here, never
# on the PC. The APK is the run's artifact, installed with `adb install`.
# The Gradle project in apps/android/gen/android was made by
# `tauri android init` and is kept in the repo, changed by hand from there.
name: Android

# Every push that touches the Android app or what it is built from, on any
# branch: the run also shows on the branch's pull request.
on:
  push:
    paths: ['apps/android/**', 'crates/core/**', 'Cargo.toml', 'Cargo.lock', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Tauri CLI works on the Android app, not on the Windows one in src-tauri.
  TAURI_APP_PATH: apps/android
  TAURI_FRONTEND_PATH: .

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      # The runner has the SDK and an NDK.
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      # The release key, so the APK installs over the released app and keeps
      # its data, and what is tried is what is released. A run without the
      # secret (a fork, Dependabot) builds a debug APK instead.
      - name: The release key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "::add-mask::$PASSWORD"
          echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - if: steps.key.outputs.signed == 'true'
        run: npx tauri android build --apk --target aarch64 --ci
      - if: steps.key.outputs.signed != 'true'
        run: npx tauri android build --debug --apk --target aarch64 --ci

      - uses: actions/upload-artifact@v7
        with:
          name: pswmanager-apk
          path: apps/android/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
