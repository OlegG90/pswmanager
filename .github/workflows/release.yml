# Builds pswm.exe for x64 and ARM64. A pushed `v*` tag publishes both to a
# GitHub Release; a manual run ("Run workflow") only uploads them as an artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # One x64 runner builds both: MSVC cross-compiles to ARM64.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne $env:TAG) {
            throw "Tag $env:TAG does not match the version in src-tauri/Cargo.toml (v$version)"
          }

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - run: npm ci
      - run: npm test
      # Google Drive's OAuth client secret: not a secret for installed apps,
      # but not kept in the source; without it the build has no Google Drive.
      - run: npm run build:x64
        env:
          PSWM_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - run: npm run build:arm64
        env:
          PSWM_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Collect the exes
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/pswm.exe release/pswm-x64.exe
          Copy-Item src-tauri/target/aarch64-pc-windows-msvc/release/pswm.exe release/pswm-arm64.exe

      # Only a pushed tag publishes; a manual run never does, even from a tag.
      - name: Publish the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create $env:TAG
          release/pswm-x64.exe release/pswm-arm64.exe
          --title "PswManager $env:TAG"
          --generate-notes

      - name: Keep the exes (manual runs)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: pswm
          path: release/
