# Builds pswm.exe for x64 and ARM64 and the Android app's APK. A pushed `v*` tag
# publishes them to a GitHub Release; a manual run ("Run workflow") only
# uploads them as artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # One x64 runner builds both: MSVC cross-compiles to ARM64.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne $env:TAG) {
            throw "Tag $env:TAG does not match the version in Cargo.toml (v$version)"
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - run: npm ci
      - run: npm test
      # Google Drive's OAuth client secret: not a secret for installed apps,
      # but not kept in the source; without it the build has no Google Drive.
      - run: npm run build:x64
        env:
          PSWM_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - run: npm run build:arm64
        env:
          PSWM_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Collect the exes
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/pswm.exe release/pswm-x64.exe
          Copy-Item target/aarch64-pc-windows-msvc/release/pswm.exe release/pswm-arm64.exe

      # Only a pushed tag publishes; a manual run never does, even from a tag.
      - name: Publish the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create $env:TAG
          release/pswm-x64.exe release/pswm-arm64.exe
          --title "PswManager $env:TAG"
          --generate-notes

      - name: Keep the exes (manual runs)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: pswm
          path: release/

  # The Android app, signed with its release key, added to the same release.
  android:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAURI_APP_PATH: apps/android
      TAURI_FRONTEND_PATH: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      - name: The release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then echo "::error::The release key's secrets are missing"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "::add-mask::$PASSWORD"
          echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - run: npx tauri android build --apk --target aarch64 --ci

      # Only the signed APK: an `-unsigned` one means signing failed.
      - name: Collect the APK
        run: |
          mkdir -p release
          apk="$(find apps/android/gen/android/app/build/outputs/apk -name '*-release.apk' | head -1)"
          if [ -z "$apk" ]; then echo "::error::No signed release APK was built"; exit 1; fi
          cp "$apk" release/pswmanager-android.apk

      - name: Add it to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release/pswmanager-android.apk --clobber

      - name: Keep the APK (manual runs)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: pswmanager-android
          path: release/
