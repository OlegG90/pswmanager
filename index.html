<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PswManager</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <form id="unlock" hidden autocomplete="off">
      <svg class="logo" viewBox="0 0 256 256" aria-hidden="true">
        <rect x="16" y="16" width="224" height="224" rx="48" fill="#2f5d8a" />
        <path d="M88 116V92a40 40 0 0 1 80 0v24" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" />
        <rect x="64" y="112" width="128" height="96" rx="16" fill="#fff" />
        <circle cx="128" cy="152" r="14" fill="#2f5d8a" />
        <rect x="121" y="156" width="14" height="30" rx="6" fill="#2f5d8a" />
      </svg>
      <h1>PswManager</h1>
      <p id="app-version" class="muted"></p>
      <div class="file-row database">
        <div class="where">
          <span id="database-kind" class="muted"></span>
          <select id="database-select" aria-label="Database" hidden></select>
          <span id="database-name"></span>
          <span id="database-description" class="muted" hidden></span>
          <span id="database-path" class="path"></span>
        </div>
        <button type="button" id="change-database" title="Add a database: open another file, or one from a folder or a cloud store">Add…</button>
      </div>
      <label class="field">
        <span>Master password</span>
        <input id="password" type="password" />
      </label>
      <div class="file-row key-file">
        <span id="key-file-path" class="path muted" hidden></span>
        <button type="button" id="pick-key-file" title="A KeePass key file (.keyx or .key), needed only if this database was set up with one">Key file…</button>
        <button type="button" id="clear-key-file" hidden>Remove</button>
      </div>
      <p id="key-file-hint" class="muted" hidden>Only if this database was set up with one: a .keyx or .key file, kept apart from it. New ones are made in Settings → Database.</p>
      <button type="submit" id="unlock-button" class="primary">Unlock</button>
      <p id="unlock-error" role="alert" hidden></p>
      <p id="notice" class="muted" hidden></p>
    </form>

    <div id="choose" hidden></div>

    <div id="vault" hidden>
      <header id="toolbar">
        <input id="search" type="search" placeholder="Search title, user name, URL, tags, notes" aria-label="Search" autocomplete="off" spellcheck="false" />
        <span id="sync-status" class="muted" role="status" hidden></span>
        <button id="key-button" title="Enter the master password or key file another device changed to" hidden>Enter key…</button>
        <button id="sync-button" title="Sync now" hidden>Sync</button>
        <button id="health-button" title="Find reused, weak and old passwords">Health</button>
        <button id="settings-button" title="Settings (Ctrl+,)">Settings</button>
        <button id="lock-button" title="Lock (Ctrl+L)">Lock</button>
      </header>
      <nav id="sidebar" aria-label="Groups and tags">
        <h3 id="groups-heading">Groups</h3>
        <ul id="groups"></ul>
        <h3 id="tags-heading" hidden>Tags</h3>
        <ul id="tags"></ul>
      </nav>
      <div id="list-pane">
        <div id="list-header">
          <span id="entry-count"></span>
          <button type="button" id="empty-trash" class="danger" title="Delete everything in the trash permanently" hidden>Empty trash…</button>
          <button type="button" id="new-entry" class="primary" title="New entry (Ctrl+N)">New entry</button>
        </div>
        <ul id="list" role="listbox" aria-label="Entries" tabindex="0"></ul>
      </div>
      <section id="detail" aria-label="Entry"></section>
    </div>

    <div id="health" hidden></div>
    <div id="settings" hidden></div>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
