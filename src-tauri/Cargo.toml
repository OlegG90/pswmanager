[package]
name = "pswmanager"
version = "0.1.0"
description = "A minimal tray password manager on KeePass KDBX"
authors = ["OlegG90"]
license = "MIT"
repository = "https://github.com/OlegG90/pswmanager"
edition = "2021"
rust-version = "1.89"

[lib]
name = "pswm_lib"

[[bin]]
name = "pswm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6.1"
base32 = "0.5.1"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.4.3"
keepass = { version = "0.15", features = ["save_kdbx4"] }
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
totp-lite = "2.0.1"
ureq = { version = "3.2.1", default-features = false, features = ["native-tls", "gzip"] }
url = "2"
uuid = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Credentials", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }
zeroize = { version = "1.8.2", features = ["derive"] }
zxcvbn = "3.1.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# Dependencies optimised in debug builds too, so unlocking (Argon2) takes a second, not half a minute.
[profile.dev.package."*"]
opt-level = 3
