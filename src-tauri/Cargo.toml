[package]
name = "pswmanager"
version = "0.5.1"
description = "A minimal tray password manager on KeePass KDBX"
authors = ["OlegG90"]
license = "MIT"
repository = "https://github.com/OlegG90/pswmanager"
edition = "2021"
rust-version = "1.89"

[lib]
name = "pswm_lib"

[[bin]]
name = "pswm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pswm-core = { path = "../crates/core" }
arboard = "3.6.1"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.4.3"
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Console", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }
zeroize = { version = "1.8.2", features = ["derive"] }
zxcvbn = "3.1.1"

[dev-dependencies]
tempfile = "3.27.0"
