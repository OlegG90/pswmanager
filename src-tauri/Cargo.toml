[package]
name = "pswmanager"
version = "0.1.0"
description = "A minimal tray password manager on KeePass KDBX"
authors = ["OlegG90"]
license = "MIT"
repository = "https://github.com/OlegG90/pswmanager"
edition = "2021"
rust-version = "1.89"

[lib]
name = "pswm_lib"

[[bin]]
name = "pswm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6.1"
base64 = "0.23.1"
keepass = { version = "0.15", features = ["save_kdbx4"] }
# Only for its "overlapped-lists" feature: keepass parses KDBX XML with quick-xml, and without it
# an entry whose <String> fields are not contiguous (as pykeepass writes them) fails to open.
quick-xml = { version = "0.42", features = ["overlapped-lists"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
ureq = { version = "3.2.1", default-features = false, features = ["native-tls", "gzip"] }
url = "2"
uuid = "1"
windows-sys = { version = "0.61.2", features = ["Win32_System_DataExchange"] }
zeroize = "1.8.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# Dependencies optimised in debug builds too, so unlocking (Argon2) takes a second, not half a minute.
[profile.dev.package."*"]
opt-level = 3
