[package]
name = "pswmanager"
version.workspace = true
description = "A minimal tray password manager on KeePass KDBX"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "pswm_lib"

[[bin]]
name = "pswm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pswm-core = { path = "../crates/core" }
arboard = "3.6.1"
base64 = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
notify = "8"
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Console", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }
zeroize = { workspace = true }
zxcvbn = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
